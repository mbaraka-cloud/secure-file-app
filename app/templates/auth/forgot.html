<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mot de passe oublié</title>
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="absolute top-4 w-full max-w-sm px-4">
    <div hx-get="{{ url_for('auth.get_flash') }}" hx-trigger="load, revealed" hx-swap="outerHTML"></div>
  </div>

  <form method="POST" class="bg-white p-6 rounded-xl shadow-md w-full max-w-sm space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2 class="text-2xl font-bold text-center">🔐 Mot de passe oublié</h2>

    <input type="email" name="email" required
           class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
           placeholder="Votre email" />

    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded font-semibold transition">
      Envoyer le lien de réinitialisation
    </button>

    <p class="text-sm text-center">
      <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline">Retour à la connexion</a>
    </p>
  </form>
</body>
</html>
