<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Réinitialiser le mot de passe</title>
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="absolute top-4 w-full max-w-sm px-4">
    <div hx-get="{{ url_for('auth.get_flash') }}" hx-trigger="load, revealed" hx-swap="outerHTML"></div>
  </div>

  <form method="POST" class="bg-white p-6 rounded-xl shadow-md w-full max-w-sm space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2 class="text-2xl font-bold text-center">🔁 Réinitialiser le mot de passe</h2>

    <p class="text-sm text-gray-600 text-center mb-2">Compte : <strong>{{ email }}</strong></p>

    <input type="password" name="password" required minlength="{{ current_app.config.get('PASSWORD_MIN_LENGTH', 8) }}"
           class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
           placeholder="Nouveau mot de passe" />

    <input type="password" name="password_confirm" required
           class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
           placeholder="Confirmez le mot de passe" />

    <button class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded font-semibold transition">
      Mettre à jour
    </button>

    <p class="text-sm text-center">
      <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:underline">Retour à la connexion</a>
    </p>
  </form>
</body>
</html>
