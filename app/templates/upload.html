{% extends "base.html" %}
{% block title %}Uploader un fichier{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-4">
  <h1 class="text-2xl font-semibold">Uploader un fichier</h1>

  <div class="bg-white rounded shadow p-4 space-y-4">
    <form id="upload-form" method="post" action="{{ url_for('main.upload_file') }}" enctype="multipart/form-data" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div>
        <label class="block text-sm font-medium mb-1">Sélectionner un fichier</label>
        <input type="file" name="file" required
               class="block w-full border rounded px-3 py-2 focus:outline-none focus:ring" />
        <p class="text-xs text-gray-500 mt-1">Taille max autorisée par le serveur : 1 Go.</p>
      </div>

      <div class="flex items-center gap-3">
        <button type="submit" id="btn-upload" class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700">
          ⬆️ Envoyer
        </button>
        <button type="button" id="btn-cancel" class="px-4 py-2 rounded bg-gray-300 text-gray-800 hover:bg-gray-400 hidden">
          Annuler
        </button>
      </div>

      <!-- Barre de progression -->
      <div id="up-wrap" class="hidden">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-medium">Envoi en cours…</span>
          <span id="up-percent" class="text-sm text-gray-600">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded h-3 overflow-hidden">
          <div id="up-bar" class="bg-green-600 h-3" style="width:0%"></div>
        </div>
        <div class="flex items-center justify-between text-xs text-gray-500 mt-1">
          <span id="up-stats">0 / 0</span>
          <span id="up-eta">ETA —</span>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/upload_progress.js') }}"></script>
{% endblock %}
