<div id="share-box-{{ file.id }}" class="mt-2">
  <form
    id="share-inline-form-{{ file.id }}"
    class="bg-white border rounded p-3 flex flex-col gap-2 md:flex-row md:items-end"
    hx-post="{{ url_for('main.share_file', file_id=file.id) }}"
    hx-target="#share-box-{{ file.id }}"
    hx-swap="outerHTML"
  >
    <!-- CSRF requis pour Flask-WTF -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <!-- ⚠️ requis si ShareForm attend file_id -->
    <input type="hidden" name="file_id" value="{{ file.id }}"/>

    <div class="flex-1">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Partager « {{ file.filename }} »
      </label>
      <input
        type="email"
        name="email"
        required
        autocomplete="email"
        placeholder="ex: destinataire@example.com"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring"
      />
      <p class="text-xs text-gray-500 mt-1">
        Saisissez l’adresse e-mail du destinataire, puis cliquez sur « Envoyer ».
      </p>
    </div>

    <div class="flex gap-2">
      <button
        type="submit"
        class="px-3 py-2 rounded bg-blue-600 text-white hover:bg-blue-700"
      >
        Envoyer
      </button>

      <!-- Fermer le formulaire inline localement, sans requête -->
      <button
        type="button"
        class="px-3 py-2 rounded bg-gray-200 hover:bg-gray-300 text-gray-800"
        onclick="document.getElementById('share-box-{{ file.id }}').innerHTML='';"
      >
        Annuler
      </button>
    </div>
  </form>
</div>
