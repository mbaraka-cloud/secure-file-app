<!-- app/templates/partials/delete_modal.html -->
<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" data-modal data-user="{{ user.id }}">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md">
    <div class="px-4 py-3 border-b flex items-center justify-between">
      <h3 class="font-semibold">Supprimer l’utilisateur</h3>
      <button class="text-gray-500 hover:text-black" type="button" data-close-modal aria-label="Fermer">✕</button>
    </div>
    <div class="p-4 space-y-3">
      <p class="text-sm">
        Cette action supprimera définitivement l’utilisateur <strong>{{ user.email }}</strong>
        ainsi que tous ses fichiers, partages, jetons de téléchargement et historiques associés.
      </p>
      <form
        hx-post="{{ url_for('admin.delete_user', user_id=user.id) }}"
        hx-target="#user-row-{{ user.id }}"
        hx-swap="outerHTML"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mt-4 flex justify-end gap-2">
          <button type="button" class="px-3 py-1 rounded border" data-close-modal>Annuler</button>
          <button type="submit" class="px-3 py-1 rounded bg-red-600 text-white hover:bg-red-700">Supprimer</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
(function(){
  const modal = document.currentScript.previousElementSibling;
  if(!modal) return;
  const form = modal.querySelector('form');
  function close(){ modal.remove(); }
  modal.addEventListener('click', (e)=>{ if(e.target === modal) close(); });
  modal.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click', close));
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') close(); }, {once:true});
  form.addEventListener('htmx:afterOnLoad', function(e){
    close();
    const hdr = e.detail?.xhr?.getResponseHeader('HX-Trigger');
    try{
      const data = JSON.parse(hdr||'{}');
      if(data.toast) showToast(data.toast);
      else showToast('Utilisateur supprimé');
    }catch(_){ showToast('Utilisateur supprimé'); }
  });
  window.showToast = window.showToast || function(msg){
    let box = document.getElementById('toasts');
    if(!box){ box = document.createElement('div'); box.id='toasts'; box.style.position='fixed'; box.style.top='12px'; box.style.right='12px'; box.style.zIndex='9999'; document.body.appendChild(box); }
    const item = document.createElement('div');
    item.className = 'bg-green-600 text-white text-sm rounded px-3 py-2 shadow mb-2';
    item.textContent = msg || 'Action effectuée';
    box.appendChild(item); setTimeout(()=>item.remove(), 2500);
  }
})();
</script>
