<div id="hx-modal" data-modal class="fixed inset-0 z-[9998] flex items-center justify-center">
  <div data-backdrop class="absolute inset-0 bg-black/40"></div>
  <div class="relative bg-white rounded shadow p-4 w-[90%] max-w-md z-[9999]">
    <h3 class="text-lg font-semibold mb-2">Rétrograder en utilisateur</h3>
    {% if last_admin %}
      <p class="text-sm text-red-700 mb-3">
        Impossible : c’est le dernier administrateur.
      </p>
      <div class="flex items-center justify-end">
        <button type="button" class="px-3 py-2 rounded border" data-close-modal>Fermer</button>
      </div>
    {% else %}
      <p class="text-sm text-gray-700 mb-3">
        Confirmer la rétrogradation de <strong>{{ u.email }}</strong> au rôle <strong>user</strong> ?
      </p>
      <form
        hx-post="{{ url_for('admin.demote_user', user_id=u.id) }}"
        hx-target="#user-row-{{ u.id }}"
        hx-swap="outerHTML"
        class="flex items-center justify-end gap-2">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="button" class="px-3 py-2 rounded border" data-close-modal>Annuler</button>
        <button type="submit" class="px-3 py-2 rounded bg-yellow-600 text-white hover:bg-yellow-700">Rétrograder</button>
      </form>
    {% endif %}
  </div>
</div>
