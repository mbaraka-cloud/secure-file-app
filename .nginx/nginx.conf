# .nginx/nginx.conf
# HTTP -> HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# HTTPS terminates here, proxy to Flask/Gunicorn
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Ajustements
    # autoriser gros uploads côté Nginx
    client_max_body_size 1024m;

    # éviter les expirations pendant un gros envoi
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 60s;

    # facultatif, réduit les buffers proxy pour ne pas tout tamponner
    proxy_request_buffering off;
    # (résolveur docker pour web)
    resolver 127.0.0.11 ipv6=off;

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          "upgrade";
    }
}
